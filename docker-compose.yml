# ============================================================
# IDS Research Pipeline System — Full Docker Stack
#
# Usage:
#   docker-compose up --build           # start all services
#   docker-compose up --build -d        # start in background
#   docker-compose down                 # stop all
#   docker-compose logs -f worker       # watch worker logs
#   docker-compose exec ui bash         # shell into UI container
#
# Data persistence:
#   - storage/datasets/ → mounted from host (put CSVs here BEFORE starting)
#   - storage/artifacts/ → mounted from host (experiment outputs persist)
#   - storage/experiments.db → mounted from host (SQLite DB persists)
# ============================================================

services:
  # --- Redis (message broker for Celery) ---
  redis:
    image: redis:7-alpine
    container_name: ids_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Celery Worker (ML pipeline execution) ---
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: ids_worker
    command: >
      celery -A workers.celery_worker worker
      --loglevel=info
      --pool=solo
      --concurrency=1
    # RAM cap for the cbr EVE pipeline (validated resource budget ~3.53 GB).
    mem_limit: 3500m
    volumes:
      - ./storage:/app/storage          # shared storage with UI
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_ASYNC=true
      - DB_PATH=/app/storage/experiments.db
      - CELERY_CONCURRENCY=1
      - JSON_LOGS=true
      - LOG_LEVEL=INFO
      # Admin pertama (dipakai UI saat start; worker ikut membacanya agar
      # environment kedua service konsisten). Nilai di bawah adalah default
      # pengembangan; timpa lewat berkas .env untuk deployment sungguhan.
      # Password minimal 8 karakter — bila lebih pendek, admin TIDAK dibuat.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-Ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-pass1234}
    restart: unless-stopped

  # --- Streamlit UI ---
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ids_ui
    ports:
      - "8501:8501"
    volumes:
      - ./storage:/app/storage          # shared storage with worker
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_ASYNC=true
      - DB_PATH=/app/storage/experiments.db
      # Admin pertama dibuat oleh service ini saat start, dari environment.
      # Setel di berkas .env (jangan di repo):
      #   ADMIN_USERNAME=admin
      #   ADMIN_PASSWORD=<password kuat, minimal 8 karakter>
      # Bila ADMIN_PASSWORD kosong, TIDAK ada admin yang dibuat (aplikasi
      # menampilkan petunjuk di halaman login) — tidak ada password bawaan.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-Ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-pass1234}
    restart: unless-stopped

volumes:
  redis_data:
